# Proxy HTTPS local — Pi-hole + ERP (host :8080)
# Certificados: ./certs/servitec.pem y servitec-key.pem (ver scripts/gen-certs.ps1)

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name erp.servitec.local servitec.erp.local servitec.pi-hole.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name servitec.pi-hole.local;

    ssl_certificate     /etc/nginx/certs/servitec.pem;
    ssl_certificate_key /etc/nginx/certs/servitec-key.pem;

    location / {
        proxy_pass http://pihole:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name erp.servitec.local servitec.erp.local;

    ssl_certificate     /etc/nginx/certs/servitec.pem;
    ssl_certificate_key /etc/nginx/certs/servitec-key.pem;

    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Acceso por IP (https://192.168.x.x) sin dominio local
