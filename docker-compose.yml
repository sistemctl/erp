# ERP TechStore — Docker Compose para Dokploy
#
# En Dokploy:
#   1. Nuevo servicio → Compose → tipo "Docker Compose"
#   2. Provider Git → repo sistemctl/erp → rama 3.0 (o la que uses)
#   3. Compose Path: ./docker-compose.yml
#   4. Environment: pega las variables de .env.docker.example (DB_PASS, JWT_SECRET, etc.)
#   5. Domains: servicio "erp", puerto 3000, tu dominio + HTTPS
#   6. Deploy
#
# Para uso local sin Dokploy usa: docker-compose.erp.yml

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-erp_techstore}
      POSTGRES_USER: ${DB_USER:-erp_user}
      POSTGRES_PASSWORD: ${DB_PASS:?Defina DB_PASS en Environment de Dokploy}
      TZ: ${TZ:-America/Bogota}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  erp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Solo expuesto a la red Docker; Dokploy/Traefik enruta el dominio
    ports:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-America/Bogota}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-erp_techstore}
      DB_USER: ${DB_USER:-erp_user}
      DB_PASS: ${DB_PASS:?Defina DB_PASS en Environment de Dokploy}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en Environment de Dokploy}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - erp_uploads:/app/backend/uploads
    networks:
      - dokploy-network
      - internal

volumes:
  pgdata:
  erp_uploads:

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge
