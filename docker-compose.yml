# ERP TechStore — Docker Compose para Dokploy
#
# En Dokploy:
#   1. Nuevo servicio → Compose → tipo "Docker Compose"
#   2. Provider Git → repo → rama
#   3. Compose Path: ./docker-compose.yml  (con el punto al inicio)
#   4. Environment: pega las variables de .env.docker.example
#      (PUBLIC_BASE_URL + CORS_ORIGINS con dominio e IP)
#   5. Domains: servicio "erp", puerto 3000, HTTPS
#      Dominio: erp.tudominio.com (configurar en Environment / Domains)
#   6. Deploy
#
# Puertos:
#   Contenedor erp → 3000
#   Host / IP      → 8080  (http://IP_DEL_VPS:8080)
#   Domains        → 3000  (proxy Dokploy → contenedor)
#
# Postgres solo en red internal (sin ports; no expuesto a internet).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-erp_techstore}
      POSTGRES_USER: ${DB_USER:-erp_user}
      POSTGRES_PASSWORD: ${DB_PASS:?Defina DB_PASS en Environment de Dokploy}
      TZ: ${TZ:-America/Bogota}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  erp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-America/Bogota}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-erp_techstore}
      DB_USER: ${DB_USER:-erp_user}
      DB_PASS: ${DB_PASS:?Defina DB_PASS en Environment de Dokploy}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en Environment de Dokploy}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - erp_uploads:/app/backend/uploads
    networks:
      - dokploy-network
      - internal

volumes:
  pgdata:
  erp_uploads:

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge
