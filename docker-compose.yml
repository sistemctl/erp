# ERP TechStore — Docker Compose
#
# Uso:
#   1. cp .env.docker.example .env   y complete los valores
#      (DB_PASS, JWT_SECRET, PUBLIC_BASE_URL, CORS_ORIGINS)
#   2. docker compose up -d --build
#
# Puertos:
#   Contenedor erp → 3000
#   Host / IP      → 8080  (http://IP_DEL_VPS:8080)
#   Para HTTPS, ponga delante un proxy (Nginx, Caddy, Cloudflare Tunnel) hacia el puerto 8080.
#
# Postgres solo en red internal (sin ports; no expuesto a internet).

services:
  postgres:
    container_name: startsystem-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-erp_techstore}
      POSTGRES_USER: ${DB_USER:-erp_user}
      POSTGRES_PASSWORD: ${DB_PASS:?Defina DB_PASS en el archivo .env}
      TZ: ${TZ:-America/Bogota}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  erp:
    container_name: startsystem-app
    image: ${ERP_IMAGE:-erp-techstore:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-America/Bogota}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-erp_techstore}
      DB_USER: ${DB_USER:-erp_user}
      DB_PASS: ${DB_PASS:?Defina DB_PASS en el archivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Proxies de confianza para X-Forwarded-For (vacío = solo redes privadas, p. ej. Nginx local)
      TRUST_PROXY: ${TRUST_PROXY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - erp_uploads:/app/backend/uploads
    networks:
      - internal

volumes:
  pgdata:
    external: true
    name: startsystem_pgdata
  erp_uploads:

networks:
  internal:
    driver: bridge
