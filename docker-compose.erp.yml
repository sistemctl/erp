# ERP TechStore — PostgreSQL + aplicación Node.js
# Uso: cp .env.docker.example .env && docker compose -f docker-compose.erp.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-erp_techstore}
      POSTGRES_USER: ${DB_USER:-erp_user}
      POSTGRES_PASSWORD: ${DB_PASS:?Defina DB_PASS en el archivo .env}
      TZ: ${TZ:-America/Bogota}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  erp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ERP_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-America/Bogota}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-erp_techstore}
      DB_USER: ${DB_USER:-erp_user}
      DB_PASS: ${DB_PASS:?Defina DB_PASS en el archivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - erp_uploads:/app/backend/uploads

volumes:
  pgdata:
    name: erp_pgdata
  erp_uploads:
    name: erp_uploads
